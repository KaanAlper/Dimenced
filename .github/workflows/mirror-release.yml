name: Mirror release from dimenced-core

# Private kod deposu KaanAlper/dimenced-core'da çıkan release'i (APK/AAB, Windows, macOS, Linux)
# bu tanıtım reposunda aynı etiketle yayınlar. Saatlik tarama + elle tetikleme + repository_dispatch.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Aynalanacak etiket (boş = dimenced-core son release)"
        type: string
        default: ""
  repository_dispatch:
    types: [core-release]

permissions:
  contents: write

concurrency:
  group: mirror-release
  cancel-in-progress: false

env:
  SRC_REPO: KaanAlper/dimenced-core
  # Fine-grained PAT: dimenced-core -> Contents: Read-only. Secret adı: CORE_READ_TOKEN
  SRC_TOKEN: ${{ secrets.CORE_READ_TOKEN }}
  GH_TOKEN: ${{ github.token }}

jobs:
  mirror:
    runs-on: ubuntu-24.04
    steps:
      - name: Kaynak release'i belirle
        id: src
        run: |
          set -euo pipefail
          if [ -z "${SRC_TOKEN:-}" ]; then
            echo "CORE_READ_TOKEN secret'ı tanımlı değil." >&2; exit 1
          fi
          TAG="${{ inputs.tag || github.event.client_payload.tag || '' }}"
          if [ -z "$TAG" ]; then
            TAG=$(GH_TOKEN="$SRC_TOKEN" gh release view --repo "$SRC_REPO" --json tagName -q .tagName)
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Eksik varlıkları indir
        id: assets
        run: |
          set -euo pipefail
          TAG="${{ steps.src.outputs.tag }}"
          mkdir -p assets
          # Kaynakta olup burada henüz olmayan dosyalar (macOS/Linux işleri sonradan biter).
          GH_TOKEN="$SRC_TOKEN" gh release view "$TAG" --repo "$SRC_REPO" --json assets -q '.assets[].name' | sort > src.txt
          # Play paketi mağaza içindir; herkese açık indirmeye konmaz.
          grep -v '^Dimenced-play\.aab' src.txt > src_public.txt || true
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            gh release view "$TAG" --repo "${{ github.repository }}" --json assets -q '.assets[].name' | sort > dst.txt
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            : > dst.txt
          fi
          comm -23 src_public.txt dst.txt > missing.txt
          echo "Eksik: $(wc -l < missing.txt) dosya"
          cat missing.txt
          while read -r name; do
            [ -n "$name" ] || continue
            GH_TOKEN="$SRC_TOKEN" gh release download "$TAG" --repo "$SRC_REPO" --dir assets --pattern "$name"
          done < missing.txt
          echo "count=$(wc -l < missing.txt)" >> "$GITHUB_OUTPUT"

      - name: Tanıtım reposunda release oluştur / tamamla
        if: steps.assets.outputs.count != '0'
        run: |
          set -euo pipefail
          TAG="${{ steps.src.outputs.tag }}"
          if [ "${{ steps.assets.outputs.exists }}" = "true" ]; then
            gh release upload "$TAG" assets/* --repo "${{ github.repository }}" --clobber
          else
            NOTES=$(GH_TOKEN="$SRC_TOKEN" gh release view "$TAG" --repo "$SRC_REPO" --json body -q .body)
            gh release create "$TAG" assets/* \
              --repo "${{ github.repository }}" \
              --title "Dimenced $TAG" \
              --notes "$NOTES" \
              --latest
          fi
