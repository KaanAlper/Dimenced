<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFCFAF"/>
      <stop offset="100%" stop-color="#CBB792"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F7F0DF"/>
      <stop offset="100%" stop-color="#EFE4CA"/>
    </linearGradient>
    <linearGradient id="planeBrass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B58934" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#B58934" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="planeOlive" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A6B41" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#4A6B41" stop-opacity="0.07"/>
    </linearGradient>
    <linearGradient id="planeRust" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9B3B2B" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#9B3B2B" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="114%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1F1A17" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Outer Kraft Background -->
  <rect x="0" y="0" width="1200" height="380" rx="14" fill="url(#bgGrad)" stroke="#1F1A17" stroke-width="2.5"/>
  <rect x="8" y="8" width="1184" height="364" rx="10" fill="none" stroke="#6A5847" stroke-width="1" stroke-dasharray="6,4" opacity="0.55"/>

  <!-- ================= PANEL 1: DYNAMIC 3D PLANES ================= -->
  <g transform="translate(26, 24)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="364" height="332" rx="10" fill="url(#cardGrad)" stroke="#1F1A17" stroke-width="2"/>
    <!-- Badge -->
    <rect x="18" y="16" width="118" height="24" rx="5" fill="#1F1A17"/>
    <text x="77" y="32" font-family="Georgia, 'Times New Roman', serif" font-size="11" font-weight="bold" fill="#F4ECD8" text-anchor="middle" letter-spacing="1.2">01 · 3D PLANES</text>
    <text x="344" y="32" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#9B3B2B" text-anchor="end">Shift + Scroll</text>

    <!-- 3D Isometric Illustration -->
    <g transform="translate(182, 138)">
      <!-- Back Plane (d = -1.0) -->
      <polygon points="-95,-42 15,-78 75,-18 -35,18" fill="url(#planeOlive)" stroke="#4A6B41" stroke-width="1.5" stroke-dasharray="4,3"/>
      <!-- Mid Plane (d = 0.0) -->
      <polygon points="-105,-8 5,-44 65,16 -45,52" fill="url(#planeBrass)" stroke="#B58934" stroke-width="2"/>
      <!-- Front Plane (d = +1.0) -->
      <polygon points="-115,26 -5,-10 55,50 -55,86" fill="url(#planeRust)" stroke="#9B3B2B" stroke-width="1.8"/>

      <!-- Normal Axis Ray -->
      <line x1="-65" y1="-25" x2="-15" y2="55" stroke="#1F1A17" stroke-width="1.8" stroke-dasharray="3,3"/>
      <circle cx="-65" cy="-25" r="4" fill="#4A6B41" stroke="#1F1A17" stroke-width="1.2"/>
      <circle cx="-40" cy="15" r="5" fill="#B58934" stroke="#1F1A17" stroke-width="1.5"/>
      <circle cx="-15" cy="55" r="4.5" fill="#9B3B2B" stroke="#1F1A17" stroke-width="1.2"/>

      <!-- Sketch Strokes on Mid & Front Planes -->
      <path d="M -68,6 C -42,-18 -10,-16 18,4 C 2,20 -35,28 -68,6 Z" fill="none" stroke="#1F1A17" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M -78,42 L -25,22 L 15,48 L -42,68 Z" fill="none" stroke="#9B3B2B" stroke-width="2.2" stroke-linejoin="round"/>

      <!-- Minimal Depth Ruler (Right) -->
      <line x1="115" y1="-55" x2="115" y2="75" stroke="#6A5847" stroke-width="2" stroke-linecap="round"/>
      <line x1="108" y1="10" x2="122" y2="10" stroke="#1F1A17" stroke-width="1.8"/>
      <circle cx="115" cy="-32" r="4" fill="#4A6B41"/>
      <circle cx="115" cy="42" r="4" fill="#9B3B2B"/>
      <polygon points="103,-12 111,-7 103,-2" fill="#B58934"/>
      <rect x="124" y="-17" width="42" height="18" rx="4" fill="#1F1A17"/>
      <text x="145" y="-5" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#F4ECD8" text-anchor="middle">+0.75</text>
    </g>

    <!-- Caption -->
    <line x1="20" y1="246" x2="344" y2="246" stroke="#D4C3A3" stroke-width="1.5"/>
    <text x="20" y="270" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="bold" fill="#1F1A17">Infinite Spatial Drawing Planes</text>
    <text x="20" y="292" font-family="sans-serif" font-size="12.5" fill="#6A5847">Push &amp; pull the active canvas along its normal axis</text>
    <text x="20" y="310" font-family="sans-serif" font-size="12.5" fill="#6A5847">with live isometric depth peek &amp; layer landmarks.</text>
  </g>

  <!-- ================= PANEL 2: 3D SNAP & SURFACE FOLLOW ================= -->
  <g transform="translate(418, 24)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="364" height="332" rx="10" fill="url(#cardGrad)" stroke="#1F1A17" stroke-width="2"/>
    <!-- Badge -->
    <rect x="18" y="16" width="136" height="24" rx="5" fill="#1F1A17"/>
    <text x="86" y="32" font-family="Georgia, 'Times New Roman', serif" font-size="11" font-weight="bold" fill="#F4ECD8" text-anchor="middle" letter-spacing="1.2">02 · SMART 3D SNAP</text>
    <text x="344" y="32" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#4A6B41" text-anchor="end">P / F / L Keys</text>

    <!-- 3D Surface Lock & Snap Illustration -->
    <g transform="translate(182, 138)">
      <!-- Two Intersecting Architectural Walls in 3D -->
      <polygon points="-110,35 -15,-25 -15,-85 -110,-25" fill="url(#planeBrass)" stroke="#B58934" stroke-width="1.8"/>
      <polygon points="-15,-25 95,25 95,-35 -15,-85" fill="url(#planeOlive)" stroke="#4A6B41" stroke-width="1.8"/>
      <!-- Floor Grid -->
      <polygon points="-110,35 -15,-25 95,25 0,85" fill="#E6D8BC" fill-opacity="0.45" stroke="#6A5847" stroke-width="1.2"/>

      <!-- Existing 3D Arch Strokes -->
      <path d="M -85,18 L -85,-22 Q -50,-58 -32,-36 L -32,-14" fill="none" stroke="#1F1A17" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M -15,-55 L 65,-18 L 65,12" fill="none" stroke="#1F1A17" stroke-width="2.6" stroke-linecap="round"/>

      <!-- Cross-Plane Bridge Stroke with Endpoint Snap -->
      <path d="M -50,-42 C -15,-62 20,-48 65,-18" fill="none" stroke="#9B3B2B" stroke-width="2.8" stroke-dasharray="6,4" stroke-linecap="round"/>

      <!-- Snap Diamond Rings -->
      <circle cx="-50" cy="-42" r="8" fill="none" stroke="#B58934" stroke-width="2"/>
      <circle cx="-50" cy="-42" r="3.5" fill="#B58934"/>
      <circle cx="65" cy="-18" r="9" fill="none" stroke="#4A6B41" stroke-width="2.2"/>
      <circle cx="65" cy="-18" r="4" fill="#4A6B41"/>

      <!-- Parallel / Axis Inference Guide Line -->
      <line x1="-105" y1="52" x2="88" y2="-52" stroke="#4A6B41" stroke-width="1.3" stroke-dasharray="3,3"/>
      <rect x="12" y="34" width="96" height="20" rx="4" fill="#4A6B41"/>
      <text x="60" y="48" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#F4ECD8" text-anchor="middle">SNAP · VERTEX</text>
    </g>

    <!-- Caption -->
    <line x1="20" y1="246" x2="344" y2="246" stroke="#D4C3A3" stroke-width="1.5"/>
    <text x="20" y="270" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="bold" fill="#1F1A17">Surface Lock &amp; Magnetic 3D Snap</text>
    <text x="20" y="292" font-family="sans-serif" font-size="12.5" fill="#6A5847">Pick any stroke face (P), follow surfaces dynamically (F),</text>
    <text x="20" y="310" font-family="sans-serif" font-size="12.5" fill="#6A5847">and bridge endpoints across 3D layers with precision.</text>
  </g>

  <!-- ================= PANEL 3: STUDIO PHOTO & 3D EXPORT ================= -->
  <g transform="translate(810, 24)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="364" height="332" rx="10" fill="url(#cardGrad)" stroke="#1F1A17" stroke-width="2"/>
    <!-- Badge -->
    <rect x="18" y="16" width="144" height="24" rx="5" fill="#1F1A17"/>
    <text x="90" y="32" font-family="Georgia, 'Times New Roman', serif" font-size="11" font-weight="bold" fill="#F4ECD8" text-anchor="middle" letter-spacing="1.2">03 · STUDIO EXPORT</text>
    <text x="344" y="32" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#B58934" text-anchor="end">2D + 3D + Replay</text>

    <!-- Studio Frame & Multi-Format Badges Illustration -->
    <g transform="translate(182, 134)">
      <!-- Polaroid / Photo Mode Frame -->
      <rect x="-125" y="-68" width="165" height="126" rx="6" fill="#FAF5E8" stroke="#1F1A17" stroke-width="2"/>
      <rect x="-115" y="-58" width="145" height="92" rx="3" fill="#E8DCC2" stroke="#6A5847" stroke-width="1"/>
      <!-- Mini 3D Pavilion inside frame -->
      <polygon points="-95,12 -42,-12 10,12 -42,28" fill="#D4C3A3" stroke="#6A5847" stroke-width="1"/>
      <path d="M -82,10 L -82,-24 L -42,-44 L -2,-24 L -2,10" fill="none" stroke="#1F1A17" stroke-width="2" stroke-linejoin="round"/>
      <path d="M -42,-44 L -42,22" fill="none" stroke="#9B3B2B" stroke-width="1.8"/>
      <circle cx="-18" cy="-38" r="7" fill="#B58934" opacity="0.8"/>
      <!-- Timelapse Scrubber Bar on Frame -->
      <line x1="-105" y1="45" x2="5" y2="45" stroke="#D4C3A3" stroke-width="4" stroke-linecap="round"/>
      <line x1="-105" y1="45" x2="-30" y2="45" stroke="#9B3B2B" stroke-width="4" stroke-linecap="round"/>
      <circle cx="-30" cy="45" r="5" fill="#1F1A17"/>

      <!-- Export Format Pills Stack (Right) -->
      <g transform="translate(54, -64)">
        <rect x="0" y="0" width="76" height="24" rx="5" fill="#9B3B2B" stroke="#1F1A17" stroke-width="1.4"/>
        <text x="38" y="16" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#F4ECD8" text-anchor="middle">GLB / glTF</text>

        <rect x="0" y="31" width="76" height="24" rx="5" fill="#B58934" stroke="#1F1A17" stroke-width="1.4"/>
        <text x="38" y="47" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#1F1A17" text-anchor="middle">OBJ / STL</text>

        <rect x="0" y="62" width="76" height="24" rx="5" fill="#4A6B41" stroke="#1F1A17" stroke-width="1.4"/>
        <text x="38" y="78" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#F4ECD8" text-anchor="middle">SVG Vector</text>

        <rect x="0" y="93" width="76" height="24" rx="5" fill="#1F1A17" stroke="#1F1A17" stroke-width="1.4"/>
        <text x="38" y="109" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#F4ECD8" text-anchor="middle">PNG / WebP</text>
      </g>
    </g>

    <!-- Caption -->
    <line x1="20" y1="246" x2="344" y2="246" stroke="#D4C3A3" stroke-width="1.5"/>
    <text x="20" y="270" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="bold" fill="#1F1A17">Photo Studio, Replay &amp; 3D Mesh</text>
    <text x="20" y="292" font-family="sans-serif" font-size="12.5" fill="#6A5847">Render paper-textured 4K snapshots, scrub stroke</text>
    <text x="20" y="310" font-family="sans-serif" font-size="12.5" fill="#6A5847">timelapses, or export 3D tube meshes to Blender.</text>
  </g>
</svg>
